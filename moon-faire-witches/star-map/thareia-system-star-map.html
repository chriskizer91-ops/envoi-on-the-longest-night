<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thareia System — Aethermoor Space Map</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06051a;color:#e9e4ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(4,3,18,.62) 100%)}
  #top{position:fixed;left:14px;top:12px;max-width:58vw}
  #top h1{margin:0;font-size:12px;letter-spacing:.26em;font-weight:600;color:#d6f3ff;
    text-shadow:0 0 12px #4cd6ff99;cursor:pointer}
  #clock{font-size:11px;opacity:.7;margin-top:4px;letter-spacing:.03em;line-height:1.4}
  #btns{position:fixed;right:12px;top:10px;display:flex;gap:8px}
  .pill{background:rgba(18,14,48,.62);color:#d9f6ff;border:1px solid rgba(120,220,255,.28);border-radius:20px;
    padding:7px 13px;font-size:12px;letter-spacing:.04em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
  .lbl{position:fixed;left:0;top:0;font-size:11px;letter-spacing:.09em;color:#e8f8ff;white-space:nowrap;
    padding:6px 9px;cursor:pointer;text-shadow:0 0 5px #000,0 0 9px #000a;will-change:transform}
  .lbl.dim{color:#c3d4ea;opacity:.8}
  .lbl.gold{color:#ffe7a8}
  .lbl.here::before{content:'◆ ';color:#ffd36b}
  #card{position:fixed;left:50%;bottom:14px;width:min(92vw,400px);box-sizing:border-box;
    transform:translate(-50%,150%);transition:transform .35s ease;
    background:rgba(12,10,36,.82);border:1px solid rgba(120,220,255,.24);border-radius:16px;
    padding:14px 16px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #card.show{transform:translate(-50%,0)}
  #card .kind{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7fe3ff;opacity:.9;padding-right:30px}
  #card h2{margin:3px 0 6px;font-size:18px;font-weight:600;color:#fff}
  #card p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#dcd6f5}
  #cFact{font-size:12px;color:#ffe2a0;margin-bottom:8px}
  #cTrip{font-size:12px;color:#bfeaf7;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  #cPips{letter-spacing:.14em;color:#ffb84a;font-size:13px;text-shadow:0 0 8px #ff9a1f}
  #cPips i{font-style:normal;opacity:.28;text-shadow:none}
  #cTrip.here{color:#ffd98a}
  #card .row{display:flex;gap:8px;align-items:center}
  #card .sp{flex:1}
  #card button{background:rgba(80,200,255,.12);color:#dff7ff;border:1px solid rgba(120,220,255,.32);
    border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
  #cPrev,#cNext{padding:7px 13px !important;font-size:15px !important;line-height:1}
  #cGo{background:rgba(255,205,110,.16) !important;border-color:rgba(255,215,130,.55) !important;color:#ffe9b8 !important}
  #cClose{position:absolute;right:8px;top:8px;border:none !important;background:none !important;
    font-size:15px !important;opacity:.7;padding:6px 9px !important}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;opacity:0;
    transition:opacity .6s;color:#cfe9ff;pointer-events:none;white-space:nowrap;text-shadow:0 0 6px #000}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
    font-size:12px;letter-spacing:.22em;color:#9fe8ff;background:#06051a;transition:opacity .9s;text-align:center;padding:0 24px}
  #lBar{width:160px;height:2px;background:rgba(120,220,255,.18);border-radius:2px;overflow:hidden}
  #lFill{display:block;height:100%;width:0;background:#7fe3ff;box-shadow:0 0 8px #7fe3ff;transition:width .2s}
</style>
</head>
<body>
<div id="vig"></div>
<div id="top"><h1 id="title">THAREIA SYSTEM</h1><div id="clock"></div></div>
<div id="btns"><button id="home" class="pill" hidden>System</button><button id="speed" class="pill">▶ Gentle</button></div>
<div id="labels"></div>
<div id="card">
  <button id="cClose" aria-label="Close">✕</button>
  <div class="kind" id="cKind"></div><h2 id="cTitle"></h2><p id="cText"></p>
  <div id="cFact"></div>
  <div id="cTrip"><span id="cPips"></span><span id="cTripTxt"></span></div>
  <div class="row"><button id="cPrev" aria-label="Previous">‹</button><button id="cNext" aria-label="Next">›</button>
    <span class="sp"></span><button id="cGo">Set course</button></div>
</div>
<div id="hint">Drag to spin · Pinch to zoom · Tap a world</div>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   1. GAME DATA — names and lore. Change text here; nothing else needs to.
      Unnamed worlds are placeholders until they get real names.
   ===================================================================== */
const START = 'thareia';          // where the player is when the map opens
const CRYSTAL_PER_PIP = 55;       // travel-cost rule: one crystal pip per this much distance (max 5)
const INFO = {
  aether: { kind:'The space between worlds', name:'The Aether',
    text:"Space here isn't empty. It's the aether. Breathe it and you fall into a blissful sleep. Amber aether crystals, found inside the worlds and drifting free in space, power every journey. They charge from the light of the three stars." },
  suns: { kind:'Binary star pair', name:'The Twin Suns',
    text:"Two stars that circle each other at the heart of the system. Every world orbits the pair, and ships' crystals charge from their light." },
  far: { kind:'Third star', name:'The Far Star',
    text:"The third star. It sits a great distance out but is still part of the system. Its light charges the crystals too." },
  w1: { kind:'Known planet', name:'Unnamed I',  text:'One of the four other known planets. Name and story still to come.' },
  w2: { kind:'Known planet', name:'Unnamed II', text:'One of the four other known planets. Name and story still to come.' },
  thareia: { kind:'Home world', name:'Thareia',
    text:"Home of the continent of Aethermoor. Most of its people have traveled by aether crystal, on little hoppers (basically skiffs) up to larger sailing vessels, all carrying massive crystals.",
    fact:'Moon: Aurous' },
  aurous: { kind:"Thareia's moon", name:'Aurous',
    text:"Holds the highest known concentration of aether crystal. Travel comes easiest to its people, so they are the wealthiest and most powerful.",
    fact:'Orbits Thareia once every 500 years' },
  w4: { kind:'Known planet', name:'Unnamed IV', text:'One of the four other known planets. Name and story still to come.' },
  drift: { kind:'Free crystal', name:'Crystal Drift',
    text:"Aether crystal isn't only found inside planets. Here the amber stone floats free, a band of it circling the suns." },
  w5: { kind:'Known planet', name:'Unnamed V',  text:'One of the four other known planets. Name and story still to come.' },
};
/* =====================================================================
   HOW A GAME PLUGS IN (window.StarMap)
     StarMap.getLocation()            -> 'thareia'
     StarMap.setLocation('aurous')    -> move the "you are here" marker
     StarMap.select('w4') / .home()   -> fly the camera
     StarMap.travelTo('aurous')       -> sail there (same as the Set course button)
     StarMap.rename('w1','Name','Lore text')
     StarMap.setYear(120) / .getYear()
   The map also announces:  window.addEventListener('starmap:arrive', e => e.detail.to)
                            'starmap:depart' (detail: from, to, crystal)   'starmap:select' (detail: key)
   ===================================================================== */

const $ = id => document.getElementById(id);
const TAU = Math.PI*2;
const PHONE = matchMedia('(pointer:coarse)').matches;
const AUTO = navigator.webdriver === true;
function fail(msg){ const l=$('loading'); l.style.opacity=1; l.style.display='flex'; $('lText').textContent=msg; $('lBar').style.display='none'; }
addEventListener('error', e => fail('The map hit a problem: '+(e.message||'unknown')));
addEventListener('unhandledrejection', e => fail('The map hit a problem: '+(e.reason&&e.reason.message||e.reason)));

/* seeded randomness: the map looks the same every time it opens */
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry(20261117);
const rr = (a,b) => a+(b-a)*rnd();

/* ---------- renderer ---------- */
let pr = Math.min(devicePixelRatio||1, PHONE?1.75:2);
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_D = 0.00085;
scene.fog = new THREE.FogExp2(0x1b1542, FOG_D);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 20000);
const HOME_DIR = new THREE.Vector3(0, 0.55, 0.84).normalize();
const homeDist = () => innerWidth < innerHeight ? 700 : 420;
camera.position.copy(HOME_DIR).multiplyScalar(homeDist()*2.6).add(new THREE.Vector3(260,240,0));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.2; controls.maxDistance = 3400;
controls.rotateSpeed = 0.7; controls.zoomSpeed = 0.9;

const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type:THREE.HalfFloatType, samples: PHONE?0:4 }));
composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.55, 0.9));
composer.addPass(new OutputPass());

/* ---------- shared shader pieces ---------- */
const U = {
  time:{value:0}, pr:{value:pr}, pxScale:{value:1},

  thareia(){ const N=makeNoise(7);     // Aethermoor as the Envoi 3D map has it, set on an open ocean

/* ---------- world materials ---------- */
const PLANET_VS = `varying vec2 vUv; varying vec3 vWP; varying vec3 vNg; varying mat3 vRot;
  void main(){ vUv=uv; vRot=mat3(modelMatrix); vec4 wp=modelMatrix*vec4(position,1.); vWP=wp.xyz; vNg=normalize(vRot*normal); gl_Position=projectionMatrix*viewMatrix*wp; }`;
function planetMat(tex, o){
  return new THREE.ShaderMaterial({
    uniforms:{ ...sunUniforms(), tAlb:{value:tex.alb}, tNrm:{value:tex.nrm}, tEmi:{value:tex.emi},
      uAtmo:{value:new THREE.Color().setRGB(...(o.atmo||[0,0,0]))}, uAtmoK:{value:o.atmoK??0}, uSpec:{value:o.spec??0},
      uEmisDay:{value:o.emisDay??1}, uEmisNight:{value:o.emisNight??1} },
    vertexShader:PLANET_VS,
    fragmentShader:`uniform sampler2D tAlb,tNrm,tEmi; ${GL_SUNS} uniform vec3 uAtmo; uniform float uAtmoK,uSpec,uEmisDay,uEmisNight;
      varying vec2 vUv; varying vec3 vWP; varying vec3 vNg; varying mat3 vRot; ${GL_FOG}
      void main(){
        vec4 nt=texture2D(tNrm,vUv);
        vec3 Ng=normalize(vNg), N=normalize(mix(Ng,normalize(vRot*(nt.xyz*2.-1.)),.8)), V=normalize(cameraPosition-vWP);
        vec3 La=normalize(uSunA-vWP), Lb=normalize(uSunB-vWP);
        float ga=dot(Ng,La), gb=dot(Ng,Lb);
        float da=max(dot(N,La),0.)*smoothstep(-.12,.22,ga), db=max(dot(N,Lb),0.)*smoothstep(-.12,.22,gb);
        vec3 alb=texture2D(tAlb,vUv).rgb;
        vec3 col=alb*(uColA*da+uColB*db+uFarCol*max(dot(N,uFarDir),0.)+uAmb);
        float sa=pow(max(dot(N,normalize(La+V)),0.),70.)*smoothstep(0.,.2,ga);
        float sb=pow(max(dot(N,normalize(Lb+V)),0.),70.)*smoothstep(0.,.2,gb);
        col+=(uColA*sa+uColB*sb)*nt.a*uSpec;
        float day=clamp(max(ga,gb)*3.+.35,0.,1.);
        col+=texture2D(tEmi,vUv).rgb*mix(uEmisNight,uEmisDay,day);
        float fres=pow(1.-max(dot(Ng,V),0.),3.2);
        col+=uAtmo*fres*uAtmoK*(.1+.9*day);
        col=mix(col,col*vec3(1.25,.82,.62),smoothstep(.35,0.,abs(max(ga,gb)-.02))*.35*uAtmoK);
        gl_FragColor=vec4(applyFog(col,vWP),1.); }` });
}
function cloudMat(tex){
  return new THREE.ShaderMaterial({ uniforms:{ ...sunUniforms(), tAlb:{value:tex.alb} }, vertexShader:PLANET_VS, transparent:true, depthWrite:false,
    fragmentShader:`uniform sampler2D tAlb; ${GL_SUNS} varying vec2 vUv; varying vec3 vWP; varying vec3 vNg; varying mat3 vRot; ${GL_FOG}
      void main(){ vec3 N=normalize(vNg); float a=texture2D(tAlb,vUv).a;
        float da=smoothstep(-.1,.6,dot(N,normalize(uSunA-vWP))), db=smoothstep(-.1,.6,dot(N,normalize(uSunB-vWP)));
        vec3 col=vec3(.74,.76,.80)*(uColA*da+uColB*db+uAmb*1.5);
        gl_FragColor=vec4(applyFog(col,vWP),a*.94); }` });
}
function haloMesh(r, color, k, s=1.11){
  const edge=Math.sqrt(1-1/(s*s));
  const m=new THREE.Mesh(new THREE.SphereGeometry(r*s,48,32), new THREE.ShaderMaterial({
    uniforms:{ uSunA:U.sunA, uSunB:U.sunB, uCol:{value:new THREE.Color().setRGB(...color)}, uK:{value:k}, uEdge:{value:edge} },
    vertexShader:`varying vec3 vWP; varying vec3 vN; varying vec3 vC;
      void main(){ vec4 wp=modelMatrix*vec4(position,1.); vWP=wp.xyz; vN=normalize(mat3(modelMatrix)*normal); vC=(modelMatrix*vec4(0.,0.,0.,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`uniform vec3 uSunA,uSunB,uCol; uniform float uK,uEdge; varying vec3 vWP; varying vec3 vN; varying vec3 vC;
      void main(){ vec3 V=normalize(cameraPosition-vWP); float a=pow(clamp(-dot(normalize(vN),V)/uEdge,0.,1.),2.6);
        vec3 c=vWP-vC; vec3 limb=normalize(c-V*dot(c,V));
        float day=clamp(max(dot(limb,normalize(uSunA-vC)),dot(limb,normalize(uSunB-vC)))*1.4+.55,0.,1.);
        gl_FragColor=vec4(uCol*a*uK*(.06+.94*day),1.); }`,
    side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  return m;
}
function orbitLine(R, color, base, tail){
  const n=256, pos=new Float32Array((n+1)*3), ang=new Float32Array(n+1);
  for(let i=0;i<=n;i++){ const a=i/n*TAU; pos.set([Math.cos(a)*R,0,Math.sin(a)*R],i*3); ang[i]=a; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('aAng',new THREE.BufferAttribute(ang,1));
  return new THREE.Line(g,new THREE.ShaderMaterial({
    uniforms:{ uHead:{value:0}, uCol:{value:new THREE.Color(color)}, uBase:{value:base}, uTail:{value:tail} },
    vertexShader:`attribute float aAng; varying float vA; void main(){ vA=aAng; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`uniform float uHead,uBase,uTail; uniform vec3 uCol; varying float vA;
      void main(){ float f=fract((uHead-vA)/6.2831853); gl_FragColor=vec4(uCol*(uBase+uTail*pow(1.-f,5.)),1.); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
}

   5. BODIES — worlds, moon, crystal drift

const bodies = [], byKey = {};
const tmpV = new THREE.Vector3();
function addBody(key, obj, r, viewDist, cls='', travel=false){
  const el=document.createElement('div'); el.className='lbl '+cls; el.textContent=INFO[key].name; $('labels').appendChild(el);
  const b={ key, obj, r, viewDist, el, travel, screen:null, worldPos(v=new THREE.Vector3()){ return obj.getWorldPosition(v); } };
  el.addEventListener('click', e=>{ e.stopPropagation(); focusOn(b); });
  bodies.push(b); byKey[key]=b; return b;
}
const WORLDS = [
  { key:'w1',      R:44,  r:2.3, phase:.6,  inc:.05,  tilt:.1,  tw:512,  bump:.3, atmo:[1,.42,.16],  atmoK:.4,  halo:.22, emisDay:.85, emisNight:1.25 },
  { key:'w2',      R:70,  r:3.8, phase:2.4, inc:-.03, tilt:.2,  tw:512,  bump:.25,  atmo:[1,.78,.5],   atmoK:.5,  halo:.4,  spec:.7 },
  { key:'thareia', R:100, r:4.6, phase:4.1, inc:0,    tilt:.4,  tw:PHONE?1536:2048, bump:.34,  atmo:[.3,.66,1.0], atmoK:.7, halo:.6, spec:.3, emisDay:.2, emisNight:1.9 },
  { key:'w4',      R:148, r:9.5, phase:.9,  inc:.04,  tilt:.35, tw:512,  bump:0,   atmo:[.75,.55,1.0],atmoK:.45, halo:.5 },
  { key:'w5',      R:228, r:3.6, phase:3.2, inc:-.06, tilt:.15, tw:512,  bump:.22, atmo:[.6,.85,1.0], atmoK:.5,  halo:.4,  spec:.45, emisDay:.3, emisNight:1.5 },
];
const worldBy = {};
const AUR = { R:17, r:1.45, period:500, phase:1.2, inc:.22 };
const DRIFT = { R:186, period:Math.pow(186/100,1.5) };
const driftBelt = new THREE.Group(); scene.add(driftBelt);

const crystalGeo = () => new THREE.LatheGeometry([new THREE.Vector2(0,-1),new THREE.Vector2(.36,-.6),new THREE.Vector2(.36,.55),new THREE.Vector2(0,1)],6);
const crystalMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:U.time, uFogCol:U.fogCol, uFogD:U.fogD },
  vertexShader:`attribute float aSeed; varying vec3 vWP; varying vec3 vL; varying float vS;
    void main(){ vL=position; vS=aSeed;
      #ifdef USE_INSTANCING
        vec4 wp=modelMatrix*instanceMatrix*vec4(position,1.);
      #else
        vec4 wp=modelMatrix*vec4(position,1.);
      #endif
      vWP=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform float uTime; varying vec3 vWP; varying vec3 vL; varying float vS; ${GL_FOG}
    void main(){
      vec3 N=normalize(cross(dFdx(vWP),dFdy(vWP))), V=normalize(cameraPosition-vWP); if(dot(N,V)<0.) N=-N;
      vec3 L=normalize(-vWP);
      float dif=max(dot(N,L),0.), fres=pow(1.-max(dot(N,V),0.),2.), sp=pow(max(dot(N,normalize(L+V)),0.),40.);
      float charge=1.+1.5*exp(-length(vWP)/80.);
      float pulse=.78+.22*sin(uTime*1.4+vS*37.);
      float core=1.-clamp(length(vL.xz)*2.4,0.,1.);
      vec3 col=vec3(.62,.30,.05)*(.25+.8*dif)+vec3(1.,.84,.5)*(fres*.55+sp)+vec3(1.,.52,.08)*(.3+.6*core)*pulse*charge*.55;
      gl_FragColor=vec4(applyFog(col,vWP),1.); }` });
function crystalField(n, place){
  const g=crystalGeo(), seeds=new Float32Array(n), im=new THREE.InstancedMesh(g,crystalMat,n);
  const M=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3(), p=new THREE.Vector3();
  for(let i=0;i<n;i++){ place(i,p,q,s); im.setMatrixAt(i,M.compose(p,q,s)); seeds[i]=rnd(); }
  g.setAttribute('aSeed',new THREE.InstancedBufferAttribute(seeds,1)); im.frustumCulled=false; return im;
}
const _e = new THREE.Euler(), UP = new THREE.Vector3(0,1,0);

async function buildWorlds(step){
  for(const d of WORLDS){
    await step(INFO[d.key].name);
    d.period=Math.pow(d.R/100,1.5);        // Thareia's year = 1; the others follow from their distance
    const tex=bake(d.tw,d.tw/2,PAINT[d.key](),d.bump);
    const holder=new THREE.Group(), tilt=new THREE.Group(); tilt.rotation.z=d.tilt; holder.add(tilt);
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(d.r,96,64),planetMat(tex,d)); tilt.add(mesh);
    holder.add(haloMesh(d.r,d.atmo,d.halo));
    const plane=new THREE.Group(); plane.rotation.x=d.inc; scene.add(plane);
    d.line=orbitLine(d.R,0x9fdcff,.07,.5); plane.add(d.line, holder);
    Object.assign(d,{holder,tilt,mesh}); worldBy[d.key]=d;
    d.body=addBody(d.key,holder,d.r,d.r*6.5,'',true);
  }
  { await step('Clouds'); const t=worldBy.thareia;
    t.clouds=new THREE.Mesh(new THREE.SphereGeometry(t.r*1.022,96,64),cloudMat(bake(512,256,PAINT.clouds(),0))); t.tilt.add(t.clouds); }
  { const d=worldBy.w4, ri=d.r*1.35, ro=d.r*2.4;   // rings, with the planet's shadow falling across them
    const ring=new THREE.Mesh(new THREE.RingGeometry(ri,ro,180,1),new THREE.ShaderMaterial({
      uniforms:{ inner:{value:ri}, outer:{value:ro}, uPR:{value:d.r}, uFogCol:U.fogCol, uFogD:U.fogD },
      vertexShader:`varying vec3 vP; varying vec3 vWP; varying vec3 vC;
        void main(){ vP=position; vec4 wp=modelMatrix*vec4(position,1.); vWP=wp.xyz; vC=(modelMatrix*vec4(0.,0.,0.,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
      fragmentShader:`uniform float inner,outer,uPR; varying vec3 vP; varying vec3 vWP; varying vec3 vC; ${GL_FOG}
        float h1(float x){ return fract(sin(x*127.1)*43758.5453); }
        float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h1(i),h1(i+1.),f); }
        void main(){ float r=(length(vP.xy)-inner)/(outer-inner);
          float b=.5*n1(r*13.)+.3*n1(r*44.)+.2*n1(r*120.);
          float a=smoothstep(0.,.03,r)*smoothstep(1.,.94,r)*(.12+.88*b);
          a*=1.-.9*smoothstep(.03,.012,abs(r-.6));
          vec3 L=normalize(-vWP); vec3 pc=vC-vWP; float t=dot(pc,L); float d=length(pc-L*t);

      side:THREE.DoubleSide, transparent:true, depthWrite:false }));
    ring.rotation.x=-Math.PI/2; d.tilt.add(ring); }
  { await step(INFO.aurous.name); const t=worldBy.thareia;   // the crystal moon
    const holder=new THREE.Group();
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(AUR.r,80,56),
      planetMat(bake(512,256,PAINT.aurous(),.42),{ atmo:[1.,.74,.38], atmoK:.3, spec:.7, emisDay:.3, emisNight:1.6 }));
    holder.add(mesh, haloMesh(AUR.r,[1.,.68,.28],.22,1.1));
    const sites=[]; let guard=0;                 // crystal spires grow out of the veins
    while(sites.length<64 && guard++<20000){ const u=rnd()*2-1, a=rnd()*TAU, s=Math.sqrt(1-u*u), v=new THREE.Vector3(-s*Math.cos(a),u,s*Math.sin(a)); if(aurousVein(v.x,v.y,v.z)>.95) sites.push(v); }

    mesh.add(spires);
    holder.add(glowSprite(new THREE.Color().setRGB(1.,.6,.18),6,.2));
    const plane=new THREE.Group(); plane.rotation.x=AUR.inc; t.holder.add(plane);
    AUR.line=orbitLine(AUR.R,0xffdf9a,.16,.6); plane.add(AUR.line,holder);

    AUR.body=addBody('aurous',holder,AUR.r,7.5,'gold',true);
  }
  { await step(INFO.drift.name);

  for(const b of [...bodies].sort((a,c)=>c.pri-a.pri)){
    const s=b.screen; let show=s.on && !trip;
    const ly=s.y-s.rad-14;
    if(show && b.key==='suns' && s.dist<34) show=false;
    if(show && b.key==='aurous' && b!==selected){ const t=byKey.thareia.screen; if(Math.hypot(t.x-s.x,t.y-s.y)<46) show=false; }
    if(show) for(const o of shown){ if(Math.abs(o.x-s.x)<(o.w+s.w)/2 && Math.abs(o.y-ly)<17){ show=false; break; } }
    b.el.style.display=show?'block':'none';
    if(show){ shown.push({x:s.x,y:ly,w:s.w}); b.el.style.transform=`translate(${s.x}px,${s.y-s.rad-3}px) translate(-50%,-100%)`; }
  }
}

/* =====================================================================
   10. FRAME LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let perfT=performance.now(), perfN=0, perfTries=0, frameN=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05); real+=dt; U.time.value=real; frameN++;
  const sp=SPEEDS[speedI][1];
  years+=dt*sp; orbitYears+=dt*Math.min(sp,.35); if(sp>0) sunAng+=dt*.14;
  placeAll();
  for(const d of WORLDS) if(d.key!=='thareia') d.mesh.rotation.y+=dt*(d.key==='w4'?.2:.1);
  { const tm=worldBy.thareia.mesh;                     // Thareia turns slowly, and turns Aethermoor to face you when chosen
    if(faceT!==null){ const d=((faceT-tm.rotation.y+Math.PI)%TAU+TAU)%TAU-Math.PI; tm.rotation.y+=d*Math.min(1,dt*2.5); if(Math.abs(d)<.01) faceT=null; }
    else tm.rotation.y+=dt*.03; }
  worldBy.thareia.clouds.rotation.y+=dt*.028; AUR.mesh.rotation.y+=dt*.04;
  updateShips(dt); updateTrip(dt);
  updateCamera(dt); controls.update();
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  if(selected && !trip) placeRing(selRing,selected,1.6,real*.25); else selRing.visible=false;
  if(here && !trip && here!==selected) placeRing(hereRing,here,1.32,0,.05*Math.sin(real*2.4)); else hereRing.visible=false;
  if(selected && selected.travel && selected!==here && !trip) updateRoute(here,selected); else route.visible=false;
  updateLabels();
  if(frameN%30===0 && cardKey) refreshTrip();
  const pct=(((years/AUR.period)%1)+1)%1*100;
  $('clock').textContent = trip ? `Sailing to ${INFO[trip.to.key].name}…`
    : `Year ${years.toFixed(years<100?2:0)} · Aurous ${pct.toFixed(pct<1?2:1)}% around`;
  composer.render();
  // if the device is struggling, trade a little sharpness for smoothness
  if(!AUTO && perfTries<3 && ++perfN===90){ const now=performance.now(), avg=(now-perfT)/90; perfT=now; perfN=0;
    if(avg>27 && pr>1){ pr=Math.max(1,pr-.375); applySize(); perfTries++; } else if(avg<=27) perfTries=3; }
  requestAnimationFrame(frame);
}
function applySize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth,innerHeight);
  composer.setPixelRatio(pr); composer.setSize(innerWidth,innerHeight);
  U.pr.value=pr; U.pxScale.value=innerHeight*pr/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
addEventListener('resize',applySize);

/* =====================================================================
   11. START-UP
   ===================================================================== */
(async()=>{
  const total=WORLDS.length+4; let done=0;
  const step=async name=>{ $('lFill').style.width=(100*done++/total)+'%'; await new Promise(r=>setTimeout(r,20)); };
  await step('aether');
  sky.material.uniforms.tCube.value=bakeAether(PHONE?768:1024);
  LAND=await loadLand();
  await buildWorlds(step);
  addBody('suns',sunsAnchor,9,84,'gold'); addBody('far',farStar,10,150,'dim');
  { const anchor=new THREE.Object3D(); anchor.position.set(DRIFT.R,0,0); driftBelt.add(anchor); addBody('drift',anchor,6,44,'dim',true); }
  { const Rh=Math.hypot(FAR.x,FAR.z), pts=[]; for(let i=0;i<=256;i++){ const a=i/256*TAU; pts.push(new THREE.Vector3(Math.cos(a)*Rh,FAR.y,Math.sin(a)*Rh)); }
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({ color:0xff9f8a, transparent:true, opacity:.14, dashSize:Rh*.02, gapSize:Rh*.025, fog:false, depthWrite:false }));
    l.computeLineDistances(); scene.add(l); }
  const ORDER=['suns','w1','w2','thareia','aurous','w4','drift','w5','far'];
  bodies.sort((a,b)=>ORDER.indexOf(a.key)-ORDER.indexOf(b.key));
  buildShips(); player=makeTraveler('vessel',true); player.g.visible=player.trail.visible=false;
  setHere(byKey[START]);
  $('lFill').style.width='100%';
  applySize(); placeAll();
  focusOn(SYSTEM,{ dur:AUTO?.01:4.2 });
  requestAnimationFrame(frame);
  $('loading').style.opacity=0; setTimeout(()=>{ $('loading').style.display='none'; showHint(); },950);

  window.StarMap = {
    getLocation:()=>here.key,
    setLocation:k=>{ if(byKey[k]&&byKey[k].travel&&!trip){ setHere(byKey[k]); if(cardKey) refreshTrip(); } },
    select:k=>byKey[k]&&focusOn(byKey[k]), home:()=>focusOn(SYSTEM),
    travelTo:k=>travelTo(byKey[k]),
    rename:(k,name,text)=>{ if(!INFO[k]) return; INFO[k].name=name; if(text) INFO[k].text=text; if(byKey[k]) byKey[k].el.textContent=name; if(cardKey===k) showCard(k); },
    setYear:y=>{ years=orbitYears=y; }, getYear:()=>years,
    setSpeed:i=>{ speedI=i; $('speed').textContent=SPEEDS[i][0]; },
    crystalCost:k=>byKey[k]?crystalCost(here,byKey[k]):null,
    _skip:()=>{ if(tween) tween.t=1; }, _clear:k=>{ let m=1e9; for(let i=0;i<=200;i++) m=Math.min(m,pathPoint(here,byKey[k],i/200,1,.1,new THREE.Vector3()).length()); return m; }, _ship:(i,d=5)=>focusOn({key:'_s',r:1,viewDist:d,worldPos:v=>ships[i].g.getWorldPosition(v)},{silent:true}), _trip:f=>{ if(trip) trip.t=f; }, _close:hideCard, _rot:a=>{ worldBy.thareia.mesh.rotation.y=a; }, _clouds:v=>{ worldBy.thareia.clouds.visible=v; },
  };
})();
</script>
