<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Envoi in 3D: Eldergrove’s edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#0a0b18;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0}
#world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* the thumb's ring: where it went down, and where it is */
#ring{position:absolute;display:none;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(230,226,255,.42);background:rgba(20,18,44,.18);pointer-events:none;z-index:3}
#dot{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:rgba(240,236,255,.5);transform:translate(-50%,-50%);pointer-events:none}
/* the one button: the painting from above */
#guide{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:4;appearance:none;width:46px;height:46px;border-radius:23px;border:1px solid rgba(214,222,255,.45);background:rgba(14,14,36,.62);display:grid;place-items:center;padding:0}
#guide svg{width:24px;height:24px}
#guide.on{background:rgba(120,100,40,.75);border-color:rgba(255,230,160,.7)}
#numbers{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:none;padding:6px 12px;border-radius:14px;background:rgba(10,10,28,.72);color:#e8e6ff;font:14px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;white-space:nowrap}
#toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;max-width:calc(100% - 120px);padding:8px 14px;border-radius:16px;background:rgba(14,12,34,.72);color:#f4f0ff;font:15px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
/* a keepsake found: its card, at the bottom, until tapped */
#card{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:6;display:flex;gap:12px;align-items:center;width:min(340px,calc(100% - 28px));padding:12px 14px;border-radius:18px;background:rgba(16,13,34,.88);border:1px solid rgba(255,226,160,.45);color:#f4f0ff;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card img{width:72px;height:72px;object-fit:contain;flex:none;filter:drop-shadow(0 0 8px rgba(255,220,150,.45))}
#card b{display:block;font:400 21px/1.15 "IM Fell English",Georgia,serif;color:#ffe6a8;margin-bottom:3px}
#card p{margin:0;font:14px/1.35 "Atkinson Hyperlegible",system-ui,sans-serif;color:#d8d4f0}
#load{position:fixed;inset:0;z-index:9;display:grid;place-content:center;text-align:center;background:#0a0b18;color:#e8e4ff;font-family:"IM Fell English",Georgia,serif;transition:opacity .6s}
#load h1{margin:0 0 10px;font-weight:400;font-size:34px;letter-spacing:.02em}
#load p{margin:0;font:15px "Atkinson Hyperlegible",system-ui,sans-serif;color:#b8b4e0}
</style>
</head>
<body>
<div id="world"><canvas id="cv"></canvas><div id="ring"><div id="dot"></div></div>
  <button id="guide" aria-label="Show the painting from above"><svg viewBox="0 0 24 24" fill="none" stroke="#eee8ff" stroke-width="1.7" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
  <div id="numbers"></div><div id="toast"></div>
  <div id="card" role="dialog" aria-live="polite"><img id="cardpic" alt=""><div><b id="cardname"></b><p id="cardlook"></p></div></div></div>
<div id="load"><div><h1>Eldergrove’s edge</h1><p id="loadmsg">Loading…</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../witches/meshopt_simplifier.js"></script>
<script src="../witches/palette.js"></script>
<script src="../witches/io_tex.js"></script>
<script src="../build/io_plus.js"></script>
<script src="../witches/witch_levels.js"></script>
<script src="../src/moon-io.js"></script>
<script src="../../src/game/maps.js"></script>
<script src="../../envoi-final-draft/items/items.js"></script>
<script src="./engine/core.js"></script>
<script src="./engine/paint.js"></script>
<script src="./engine/world.js"></script>
<script src="./engine/walker.js"></script>
<script src="./places/eldergrove-edge.js"></script>
<script src="./places/eldergrove-edge-trees.js"></script>
<script>
// Envoi's town square in 3D, with Moon Faire's Io walking it (the world3d job, November 16, 2026).
(async function () {
  const $ = (id) => document.getElementById(id);
  const place = window.W3D_PLACES['eldergrove-edge'];
  // the painting, for the guide: inside the file when built; from the repository's art folder when not
  place.paintingSrc = /^data:/.test(place.painting) ? place.painting : '../../' + place.painting;
  let toastT = 0, cardT = 0;
  const toast = (s) => { const t = $('toast'); t.textContent = s; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 2600); };
  try {
    const W = await W3D.walk({
      place, root: $('world'), canvas: $('cv'), ring: $('ring'), dot: $('dot'), toast,
      say: (s) => { $('loadmsg').textContent = s; },
      onGuide: (on) => { $('guide').classList.toggle('on', on); $('numbers').style.display = on ? 'block' : 'none'; },
      onItem: (it) => {
        $('cardpic').src = /^data:/.test(it.pic) ? it.pic : '../../' + it.pic; $('cardname').textContent = it.name;
        $('cardlook').textContent = it.look ? it.look.charAt(0).toUpperCase() + it.look.slice(1) + '.' : '';
        $('card').classList.add('on'); clearTimeout(cardT); cardT = setTimeout(() => $('card').classList.remove('on'), 7000);
      },
      onStats: (n) => { $('numbers').textContent = n.fps + ' frames a second · ' + Math.round(n.triangles / 1000) + 'k triangles · ' + n.calls + ' draw calls'; },
    });
    $('card').addEventListener('click', () => $('card').classList.remove('on'));
    $('guide').addEventListener('click', () => W.guide(!W.P || !$('guide').classList.contains('on')));
    $('load').style.opacity = 0; setTimeout(() => { $('load').style.display = 'none'; }, 700);
    setTimeout(() => toast('Drag on the left to walk · drag on the right to look'), 900);
    window.__ready = true;
  } catch (e) { console.error(e); $('loadmsg').textContent = 'Something went wrong: ' + e.message; }
})();
</script>
</body>
</html>
