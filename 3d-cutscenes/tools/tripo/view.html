<!doctype html><html><head><meta charset="utf-8"><title>GLB view</title>
<style>html,body{margin:0;height:100%;background:#2a2730}canvas{display:block;width:100%;height:100%}</style></head><body>
<canvas id="c"></canvas>
<!-- view.html: one glTF model in a plain studio light, for headless pictures (shoot.mjs). ?f= the model, from this folder;
     ?mo=1 for a meshopt-compressed one. window.shot({ y, dist, yaw, up, fov, mode, anime, box }) draws it. -->
<script src="../../.cache/three.min.js"></script><script src="../../.cache/GLTFLoader.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(innerWidth, innerHeight, false);
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0;
const S = new THREE.Scene(); S.background = new THREE.Color('#5a5660');
S.add(new THREE.HemisphereLight(0xffffff, 0x404050, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1.2, 2, 2.2); S.add(key);
const fill = new THREE.DirectionalLight(0xffe0d0, 0.5); fill.position.set(-2, 1, 1); S.add(fill);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50);
let model = null, mats = [];
(async () => { const L = new THREE.GLTFLoader(); if (Q.get('mo')) { const { MeshoptDecoder } = await import('../../.cache/meshopt_decoder.mjs'); L.setMeshoptDecoder(MeshoptDecoder); }
L.load(Q.get('f') || '../../.cache/io-tripo-free.glb', (g) => {
  model = g.scene; S.add(model);
  model.traverse((o) => { if (o.isMesh) mats.push(o); });
  window.__ready = true;
}, undefined, (e) => { window.__err = String(e && e.message || e); }); })();
const texCache = {};
window.setTex = (url) => new Promise((ok) => {
  // swap the colour texture (the same UVs) for a repainted one, or back to the original with null
  if (!url) { for (const m of mats) { const pm = m.userData.pbr || m.material; if (pm.userData.orig) pm.map = pm.userData.orig; pm.needsUpdate = true; } return ok(true); }
  new THREE.TextureLoader().load(url, (t) => {
    t.flipY = false; t.encoding = THREE.sRGBEncoding;
    for (const m of mats) { const pm = m.userData.pbr || m.material; if (!pm.userData.orig) pm.userData.orig = pm.map; t.wrapS = pm.map.wrapS; t.wrapT = pm.map.wrapT; pm.map = t; pm.needsUpdate = true; if (m.userData.flat) { m.userData.flat.map = t; m.userData.flat.needsUpdate = true; } }
    ok(true);
  });
});
window.shot = (o) => {
  // mode: 'pbr' (as made), 'flat' (only the painted colours, no light)
  for (const m of mats) {
    if (!m.userData.pbr) m.userData.pbr = m.material;
    if (o.mode === 'flat') { if (!m.userData.flat) m.userData.flat = new THREE.MeshBasicMaterial({ map: m.userData.pbr.map }); m.material = m.userData.flat; }
    else m.material = m.userData.pbr;
    // anime: no bumps from the normal map and no metal, as a painted character
    const pm = m.userData.pbr; if (!pm.userData.keep) pm.userData.keep = { normalMap: pm.normalMap, metalnessMap: pm.metalnessMap, roughnessMap: pm.roughnessMap };
    if (o.anime) { pm.normalMap = null; pm.metalnessMap = null; pm.roughnessMap = null; pm.metalness = 0; pm.roughness = .85; } else { Object.assign(pm, pm.userData.keep); pm.metalness = 1; pm.roughness = 1; }
    pm.needsUpdate = true;
  }
  if (o.mode === 'clay') for (const m of mats) { if (!m.userData.clay) m.userData.clay = new THREE.MeshStandardMaterial({ color: 0xb8b0a8, roughness: .7 }); m.material = m.userData.clay; }
  S.background = new THREE.Color(o.bg || '#5a5660');
  if (o.box) { const [x0, x1, y0, y1] = o.box, oc = new THREE.OrthographicCamera(x0, x1, y1, y0, 0.01, 5); oc.position.set(0, 0, 2); oc.updateProjectionMatrix(); R.render(S, oc); return true; }
  if (o.ortho) {
    // the picture's frame: picture pixel (px, py) = (cx + x * s, py0 - y * s), the picture W x H
    const { cx, py0, s, W, H } = o.ortho, oc = new THREE.OrthographicCamera((0 - cx) / s, (W - cx) / s, py0 / s, (py0 - H) / s, 0.01, 5);
    oc.position.set(0, 0, 2); oc.lookAt(0, 0, 0); oc.position.set(0, 0, 2); oc.updateProjectionMatrix();
    R.render(S, oc); return true;
  }
  const yaw = (o.yaw || 0) * Math.PI / 180, d = o.dist || 2.2, at = new THREE.Vector3(0, o.y === undefined ? 0.5 : o.y, 0);
  cam.fov = o.fov || 30; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  cam.position.set(at.x + Math.sin(yaw) * d, at.y + (o.up || 0), at.z + Math.cos(yaw) * d); cam.lookAt(at);
  R.render(S, cam); return true;
};
</script></body></html>
