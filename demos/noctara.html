<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noctara the Starless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="../src/bench/bench.css">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../src/stage/night-square.js"></script>
<script src="../src/models/witch.js"></script>
<script src="../src/models/sol.js"></script>
<script src="../src/models/halcyon.js"></script>
<script src="../src/models/noctara.js"></script>
<script src="../src/models/previous/noctara-pass1.js"></script>
<script src="../src/bench/bench.js"></script>
<script src="../src/bench/stage-noctara.js"></script>
<script>
Bench.start({
  title: 'Noctara the Starless',
  blurb: 'The final boss in the Night square, with Halcyon, her knight, in front of her and the Witch and Sol facing them.',
  subject: {
    id: 'noctara', name: 'Noctara', make: () => makeNoctara({}), before: () => makeNoctaraPass1({}),
    home: [905, 770], face: 'witch', yawBias: 0.3, shadow: 0.75, target: 'witch',
    walkLabel: 'Glide', walkSpeed: 0.8, height: '1.9 m with the crown',
  },
  cast: [
    { id: 'witch', name: 'Witch', kind: 'witch', make: () => makeWitch(), home: [560, 812], face: 'noctara', yawBias: -0.38, shadow: 0.62 },
    { id: 'sol', name: 'Sol', make: () => makeSol({}), home: [650, 868], face: 'noctara', yawBias: -0.3, shadow: 0.6 },
    { id: 'halcyon', name: 'Halcyon', make: () => makeHalcyon({}), home: [790, 845], face: 'witch', yawBias: 0.2, shadow: 0.6 },
  ],
  groups: [
    { title: 'Darkness', acts: ['blackout', 'voidSphere'] },
    { title: 'Cold', acts: ['frostDust'] },
    { title: 'Basic attack', acts: ['crownShards'] },
    { title: 'Arrival and defeat', acts: ['appear', 'die'] },
    { title: 'Reactions', acts: ['hurt', 'block'] },
  ],
  names: { blackout: 'Blackout', voidSphere: 'Void Sphere', frostDust: 'Frost Dust', crownShards: 'Crown Shards', appear: 'Appear', die: 'Defeat', hurt: 'Hurt', block: 'Block' },
  hints: { die: 'becomes night' },
  wide: { blackout: 1, voidSphere: 1, frostDust: 1, crownShards: 1 },
  sliders: [{ label: 'Frost length', min: 6, max: 20, step: 1, value: 10, unit: ' s', onInput: (v) => STAGES.noctara.setFrostLength(v) }],
  stage: STAGES.noctara,
  note: 'Gold rings mark hits; numbers show where damage lands on the party. In Blackout, Halcyon strikes in the dark and the damage lands when the light comes back. Frost Dust slows only the party, so Noctara and Halcyon keep full speed until the thaw. In defeat she is not killed: she opens her arms, turns into the night sky and rises as stars. Before is her first touch-up; After is the second, with black silk robes, metal gold, the starry lining and the bigger spells.',
});
</script>
</body>
</html>
