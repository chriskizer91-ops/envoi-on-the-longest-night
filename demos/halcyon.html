Bench.start({

  subject: {

    { id: 'sol', name: 'Sol', make: () => makeSol({}), home: [650, 868], face: 'halcyon', yawBias: -0.3, shadow: 0.6 },

  groups: [
    { title: 'Attacks', acts: ['gloamCleave', 'duskArc', 'severance', 'lightDrinker'] },

  wide: { duskArc: 1, blackNoon: 1, blackNoonCharge: 1 },
  stage: STAGES.halcyon,
  note: "Gold rings mark hits; numbers are the bible's level 20 damage. Warden's Vow and the Black Noon charge hold until the next press. Retreat is how the level 20 fight ends: she backs away and the dark takes her from the feet up. Release is the very end: her blade warms and a pale moth rises out of her. Before and After switch between the old model and the cold blue one.",
